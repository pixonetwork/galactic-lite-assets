<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Closed</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #b30000;
        }
        .btn {
            display: inline-block;
            background-color: #e60000;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #b30000;
        }
        .backup-link {
            margin-top: 25px;
            font-size: 14px;
        }
        .backup-link a {
            color: #0066cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Our Website Has Shut Down, BUT</h1>
        <p>Other people have copied our website. Their website is actually way better. You can visit their site by clicking the button below.</p>
        
        <a href="https://example.com" class="btn">Visit Their Site</a>
        
        <div class="backup-link">
            <p>If that website is blocked, you can check <a href="https://docs.google.com/document/d/1F6yaCbKUXKGLIhoSr2I5r1idyiWGGzGBkLFc-k5p1u4">their backups doc</a> instead.</p>
        </div>
    </div>
</body>
</html>
